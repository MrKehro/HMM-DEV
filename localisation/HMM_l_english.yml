        scheldt_estuary_modifier:0 "Scheldt Estuary"
        hmm_gm_hre1_title:0 "Handle the Emperor"
        hmm_gm_hre1_desc:0 "We are at the Emperor's mercy and we need to find a way to get out of this mess."
        hmm_gm_cologne_title:0 "Koelner Dom"
        hmm_gm_cologne_desc:0 "When the cathedral is finished, the world will end"
        hmm_gm_go_west_title:0 "Go West"
        hmm_gm_go_west_desc:0 "We need to liberate our Germanic Brothers in the low Lands from the Opressors."
        hmm_gm_secure_holland_title:0 "Secure Holland"
        hmm_gm_secure_holland_desc:0 "Secure the Dutch Trade Ports to increase our trade influence in the Channel and North Sea."
        hmm_gm_integrate_low_countries_title:0 "Integrate the Low Countries"
        hmm_gm_integrate_low_countries_desc:0 "These Lands have been horribly mismanaged by the French, we will restore them to their former glory."
        hmm_gm_english_channel_dominance_title:0 "Dominate the Trade"
        hmm_gm_english_channel_dominance_desc:0 "Money Money Money Money Money Money Money Money Money Money Money Money Money Money Money Money Money Money Money Money Money"
        hmm_gm_rhineland_conquest_title:0 "Rhineland Conquest"
        hmm_gm_rhineland_conquest_desc:0 "Unite our Homelands in the Rhineland and expand our influence into the Germanic Lands."
        hmm_gm_invade_bavaria_title:0 "Invade Bavaria"
        hmm_gm_invade_bavaria_desc:0 "The Bavarians are a threat to our Nation and they need to be dealt with before they can cause any more trouble."
        hmm_gm_protect_against_austria_title:0 "Protect against Austria"
        hmm_gm_protect_against_austria_desc:0 "The Habsburgs of Austria have made repeated attempts to subjugate our nation. We must muster our forces and seek friends amongst their enemies."
        hmm_gm_end_the_habsburgs_title:0 "End the Habsburgs"
        hmm_gm_end_the_habsburgs_desc:0 "Our nation will not truly be safe until the last of the Habsburgs has been eradicated."
        hmm_gm_one_german_to_rule_em_all_title:0 "One German to rule them all"
        hmm_gm_one_german_to_rule_em_all_desc:0 "The Germans are a proud people, but they are divided. We will unite them under our banner and lead them to glory."
        hmm_gm_raise_the_army_title:0 "Raise the Army"
        hmm_gm_raise_the_army_desc:0 "We are surrounded by enemies and we need to raise a strong army to defend our nation."
        hmm_gm_braunschweig_title:0 "Secure Braunschweig"
        hmm_gm_braunschweig_desc:0 "Brunswick is our gate into Lower Saxony"
        hmm_gm_peasants_title:0 "The Peasants Republic"
        hmm_gm_peasants_desc:0 "The peasants have been infected with the ideas of the Dithmarschen Republic, we need to handle this carefully or we will have a full blown revolt on our hands."
        hmm_gm_deal_with_prussia_title:0 "Deal with Prussia"
        hmm_gm_deal_with_prussia_desc:0 "The Prussians are our main Competitor for Dominance in Northern Germany, they need to be eradicated"
        hmm_german_minor_berlin_title:0 "Ich bin ein Berliner"
        hmm_german_minor_berlin_desc:0 "Berlin is the key to Prussia and the Northern Princes, it is ours and we can now unite North Germans under our banner."
        hmm_gm_forest_expansion_title:0 "Forest Expansion"
        hmm_gm_forest_expansion_desc:0 "The forest industry is a key part of our economy, with new advances we can now expand our Cities even further and enrich our nation."
        hmm_gm_electorate_of_saxony_title:0 "Electorate of Saxony"
        hmm_gm_electorate_of_saxony_desc:0 "The Electorate of Saxony has to be on our Side if we want to stand any Chance of defeating the Habsburgs and their allies."
        hmm_gm_saxony_expansion_title:0 "Expansion into Saxony"
        hmm_gm_saxony_expansion_desc:0 "The Saxons shall no longer be a divided people, but instead be united under our banner."
        hmm_gm_hansa_title:0 "Crush the Hansa"
        hmm_gm_hansa_desc:0 "For too long those merchants have been sucking the wealth out of our nation, we will crush them and take back what is rightfully ours."
        hmm_gm_dominate_lubeck_title:0 "Dominate Lubeck"
        hmm_gm_dominate_lubeck_desc:0 "Lubeck is the Center of Trade in the whole Region, whoever controls it will secure riches beyond their imagination."
        hmm_gm_umgestaltung_der_natur_title:0 "Transformation of Nature"
        hmm_gm_umgestaltung_der_natur_desc:0 "The Germanic people have been blessed with a rich and fertile land, we just have to transform the nature around us to access its full potential."
        hmm_gm_ruhrgebiet_title:0 "Ruhrgebiet"
        hmm_gm_ruhrgebiet_desc:0 "The Ruhrgebiet will be the industrial heart of Germany"
        hmm_gm_universities_title:0 "Goettingen University"
        hmm_gm_universities_desc:0 "In publica commoda"
        hmm_gm_military_theory_title:0 "Military Theory"
        hmm_gm_military_theory_desc:0 "With our Advances in Military Theory funded by the expansion of our Universities, we have created a new Generation of Officers that will lead our armies to victory."
        hmm_gm_kruppstahl_title:0 "Friedrich Krupp AG"
        hmm_gm_kruppstahl_desc:0 "Loyalty for Loyalty"
        hmm_krupp_stahl:0 "Kruppstahl"
        desc_hmm_krupp_stahl:0 "Forged by the hands of the Krupp family and their loyal Workers, this steel is the finest in the world and will be used to create the most advanced weapons and machinery."
        hmm_gm_channel_merchant:0 "Superior Merchant Guild"
        desc_hmm_gm_channel_merchant:0 "Pecunia non olet"
        hmm_gm_choose_nobles:0 "Safeguarded the Monarchy"
        hmm_gm_choose_nobles_desc:0 "The Nobility have been the backbone of our nation for centuries and with their support we have been able to overcome the Class struggle and secured the Monarchy for future generations."
        hmm_gm_choose_clergy:0 "Turned to God for Guidance"
        hmm_gm_choose_clergy_desc:0 "The Clergy helped us out of the Class Struggle and we have been enlightened by their wisdom and guidance"
        hmm_garrison_buff:0 "Garrisoned"
        hmm_garrison_buff_desc:0 "Rebalance of Garrison Size and Assaults"
        HMM_events.32.t:0 "The Dynamics of Class Struggle"
        HMM_events.32.d:0 "After encountering the Peasants Republic of Dithmarschen, we have learned that the dynamics of class struggle are more complex than we thought. All over our Country people have been gathering and questioning the social order, we need to act fast to prevent a full blown revolution. Our Nobles have gathered a strong Host and are awaiting our order to march against the Peasants. The Pope has ensured us that only God can bring an end to this struggle once and for all and has called upon us to embrace the Divine State instead. There is a third option ..."
        HMM_events.32.0:0 "For the King!"
        HMM_events.32.1:0 "God wills it!"
        HMM_events.32.2:0 "Pull out the Guillotine!"
        kon_new_world_colonist:0 "Colonial Expansion"
        kon_new_world_colonist_desc:0 "We have increased our colonial efforts in order to keep up with the European Powers."
        hmm_gm_bavaria_tt:0 "Gain a permanent claim on every Province of Bavarian, Swabian or Franconian culture NOT owned by you, the emperor or Austria."
        hmm_gm_braunschweig_tt:0 "Gain a permanent claim on every Province of Lower Saxon culture NOT owned by you or Brandenburg/Prussia."
        hmm_gm_saxony_tt:0 "Gain a permanent claim on every Province of Saxon culture NOT owned by you, Brandebrug/Prussia, Bohemia or Austria."
        hmm_gm_umgestaltung_tt:0 "Add 5% Dev Cost reduction to our rightful Woods Provinces in Northern Germany with a Workshop for 25 years"
        hmm_gm_low_countries_tt:0 "Add an amazing boost to our rightful Provinces in the Low Countries for 25 years"
        hmm_gm_raise_army_tt:0 "Gain a permanent claim on every Province of Westphalian and Rhenish culture NOT owned by you, Brandeburg/Prussia or the Emperor."
        hmm_gm_cologne_tt:0 "The greedy man is really not rich, but poor. He does not control his money but is controlled by it."
        hmm_gm_ae:0 "Sanctioned Expansion"
        hmm_british_isles_node:0 "British Isles"
        hmm_low_countries_node:0 "Low Countries"
