        HMM_events.29.t: "Release the Deathwar Squad"
        HMM_events.29.d: "The War is over and the Squad will be free to do as they please."
        HMM_events.29.1: "They went for breakfast to Paris and never came back."
        HMM_events.29.2: "We were not brave enough to let them fulfill their destiny, we have to let them go."
        HMM_events.29.3: "We have embarrassed ourselves by submitting to the French, the brave Soldiers of the Deathwar Squad have abandoned us"
        HMM_events.29.4: "We will always remember the sacrifices of the Deathwar Squad."
        HMM_events.30.t: "A Personal Union really?"
        HMM_events.30.d: "Stop marrying your cousins, we are not a dynasty, we are a nation. We need to stop the madness of marrying our cousins and start focusing on the future of our nation."
